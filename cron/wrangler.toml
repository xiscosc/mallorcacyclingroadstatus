name = "mallorcacyclingroadstatuscron"
main = "src/index.ts"
compatibility_date = "2025-05-01"

# Runs at minute 0 of every 2nd hour: 00:00, 02:00, 04:00, ... (UTC).
[triggers]
crons = ["0 */2 * * *"]

[[r2_buckets]]
binding = "INCIDENTS"
bucket_name = "mallorca-cycling-incidents"

# Provider URLs — fill in with the real upstream endpoints.
# For local dev, mirror these in cron/.dev.vars (gitignored).
[vars]
CONSELL_POINTS_URL = ""
CONSELL_LINES_URL = ""
